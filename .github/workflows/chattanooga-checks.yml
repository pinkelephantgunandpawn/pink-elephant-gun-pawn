name: Chattanooga safety and dependency audit
on:
  push:
    branches: [main]
    paths:
      - 'pe_site/server/**'
      - 'tools/inventory-dashboard/**'
      - '.github/workflows/chattanooga-checks.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'pe_site/server/**'
      - 'tools/inventory-dashboard/**'
      - '.github/workflows/chattanooga-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pe_site/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run safety regression tests
        run: npm test
      - name: Run generic dashboard regression tests
        run: node --test ../../tools/inventory-dashboard/test/*.test.mjs
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pe_site/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Preserve dependency audit details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chattanooga-dependency-audit
          path: pe_site/server/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

